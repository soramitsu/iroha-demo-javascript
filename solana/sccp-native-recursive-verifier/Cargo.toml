[package]
name = "sccp-native-recursive-verifier"
version = "0.1.0"
edition = "2021"
description = "Sealed BN254 Groth16 verifier for TAIRA-to-Solana SCCP settlement"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake2 = "0.10"
solana-bn254 = "3.2.1"
solana-program = "4.0.0"
solana-sdk-ids = "3.1.0"
solana-system-interface = { version = "3.1.0", features = ["bincode"] }

[dev-dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
