[package]
name = "sccp-taira-xor"
version = "0.1.0"
edition = "2021"
description = "Solana testnet SCCP source and destination program for TAIRA XOR"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Production SBF builds select exactly one immutable role. Keeping the
# featureless build available preserves host-side unit tests that exercise
# both handlers without producing a deployable artifact.
destination-program = []
source-program = []

[dependencies]
blake2 = "0.10"
solana-program = "4.0.0"
solana-curve25519 = "4.0.1"
solana-sdk-ids = "3.1.0"
solana-system-interface = { version = "3.1.0", features = ["bincode"] }
