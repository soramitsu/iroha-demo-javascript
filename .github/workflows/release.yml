name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package, for example v2.0.1"
        required: true
      iroha_ref:
        description: "Exact 40-character hyperledger-iroha/iroha commit SHA"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IROHA_JS_NATIVE_BUILD_PROFILE: "release"
  IROHA_JS_NATIVE_SOURCE_GIT_REVISION: "1bcb05eb208d8bda1610789d827a7ed97e66e56c"
  NODE_VERSION: "24"
  REVIEWED_IROHA_REF: "1bcb05eb208d8bda1610789d827a7ed97e66e56c"
  REVIEWED_IROHA_PARENT: "03b2bff298cabe1c1355d78379acb4a099e6d627"
  REVIEWED_IROHA_TREE: "801349ba2350640643179c83821c43d8548ba021"
  REVIEWED_IROHA_JS_TREE: "6ce1556f6b1e1bc62f20dbc63db3e3cca6148bdc"
  REVIEWED_IROHA_CARGO_LOCK_SHA256: "28ca3f9224b55d89f6307f487462ec9f7b8027ccb0712323b779a568bc9ebfd1"
  REVIEWED_IROHA_CARGO_LOCK_SIZE: "306362"
  RUST_TOOLCHAIN: "1.93.1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  IROHA_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.iroha_ref || vars.IROHA_REF }}
  APP_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  SORANET_VPN_HELPER_BUNDLE_ID: ${{ vars.SORANET_VPN_HELPER_BUNDLE_ID }}
  SORANET_VPN_PACKET_TUNNEL_BUNDLE_ID: ${{ vars.SORANET_VPN_PACKET_TUNNEL_BUNDLE_ID }}
  SORANET_VPN_APP_GROUP_ID: ${{ vars.SORANET_VPN_APP_GROUP_ID }}
  SORANET_VPN_MANAGER_DESCRIPTION: ${{ vars.SORANET_VPN_MANAGER_DESCRIPTION }}
  HAS_IROHA_RELEASE_SIGNER_KEY: ${{ secrets.IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64 != '' }}
  HAS_MAC_SIGNING: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' && secrets.MAC_CERTIFICATE_PASSWORD != '' && secrets.APPLE_DEVELOPMENT_TEAM != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
  HAS_WIN_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}

jobs:
  preflight:
    name: Verify signed immutable release sources
    runs-on: ubuntu-24.04
    outputs:
      iroha_sha: ${{ steps.identity.outputs.iroha_sha }}
      tag_object_sha: ${{ steps.identity.outputs.tag_object_sha }}
      wallet_sha: ${{ steps.identity.outputs.wallet_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable release inputs
        shell: bash
        run: |
          expected_ref="refs/tags/$RELEASE_TAG"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@$expected_ref"

          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Release workflow must run from $expected_ref; got $GITHUB_REF."
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo "::error::Release workflow source must be $expected_workflow_ref; got $GITHUB_WORKFLOW_REF."
            exit 1
          fi
          if [[ "$GITHUB_REF_PROTECTED" != "true" ]]; then
            echo "::error::Release tag $RELEASE_TAG must be covered by an active GitHub tag-protection ruleset."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag is not a supported version tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ -z "$IROHA_REF" ]]; then
            echo "::error::IROHA_REF is required. Set the repository variable for tag pushes or the iroha_ref input for a manual rerun."
            exit 1
          fi
          if [[ ! "$IROHA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::IROHA_REF must be one exact lowercase 40-character commit SHA; got $IROHA_REF."
            exit 1
          fi
          if [[ "$IROHA_REF" != "$REVIEWED_IROHA_REF" ]]; then
            echo "::error::IROHA_REF must equal the reviewed signed v4 source $REVIEWED_IROHA_REF; got $IROHA_REF."
            exit 1
          fi
          if [[ "$HAS_IROHA_RELEASE_SIGNER_KEY" != "true" ]]; then
            echo "::error::IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64 is required and must contain the canonical base64 encoding of the reviewed public OpenPGP key."
            exit 1
          fi

      - name: Checkout wallet tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: iroha-demo-javascript
          ref: ${{ env.APP_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Iroha SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperledger-iroha/iroha
          path: iroha
          ref: ${{ env.IROHA_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed source and tag identities
        id: identity
        shell: bash
        run: |
          wallet_sha="$(git -C iroha-demo-javascript rev-parse HEAD)"
          iroha_sha="$(git -C iroha rev-parse HEAD)"
          iroha_parent="$(git -C iroha rev-parse HEAD^)"
          iroha_tree="$(git -C iroha rev-parse 'HEAD^{tree}')"
          iroha_js_tree="$(git -C iroha rev-parse HEAD:javascript/iroha_js)"
          local_tag_type="$(git -C iroha-demo-javascript cat-file -t "refs/tags/$RELEASE_TAG")"
          local_tag_object_sha="$(git -C iroha-demo-javascript rev-parse "refs/tags/$RELEASE_TAG")"
          local_tag_target_sha="$(git -C iroha-demo-javascript rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

          if [[ "$wallet_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out wallet commit $wallet_sha does not match workflow commit $GITHUB_SHA."
            exit 1
          fi
          if [[ "$iroha_sha" != "$IROHA_REF" ]]; then
            echo "::error::Checked-out Iroha commit $iroha_sha does not match pinned commit $IROHA_REF."
            exit 1
          fi
          if [[ "$iroha_parent" != "$REVIEWED_IROHA_PARENT" \
            || "$iroha_tree" != "$REVIEWED_IROHA_TREE" \
            || "$iroha_js_tree" != "$REVIEWED_IROHA_JS_TREE" ]]; then
            echo "::error::Checked-out Iroha parent/tree identities do not match the reviewed signed v4 closure."
            exit 1
          fi
          if [[ "$local_tag_type" != "tag" ]]; then
            echo "::error::$RELEASE_TAG must be an annotated tag object, not $local_tag_type."
            exit 1
          fi
          if [[ "$local_tag_target_sha" != "$wallet_sha" ]]; then
            echo "::error::$RELEASE_TAG targets $local_tag_target_sha, not checked-out wallet commit $wallet_sha."
            exit 1
          fi
          if [[ -n "$(git -C iroha-demo-javascript status --porcelain=v1)" || -n "$(git -C iroha status --porcelain=v1)" ]]; then
            echo "::error::Release source checkouts must be clean."
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          package_version="$(jq -r '.version' iroha-demo-javascript/package.json)"
          lock_version="$(jq -r '.version' iroha-demo-javascript/package-lock.json)"
          lock_root_version="$(jq -r '.packages[""].version' iroha-demo-javascript/package-lock.json)"
          if [[ "$package_version" != "$release_version" || "$lock_version" != "$release_version" || "$lock_root_version" != "$release_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json/package-lock.json versions ($package_version, $lock_version, $lock_root_version)."
            exit 1
          fi

          tag_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_object_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          if [[ "$tag_object_type" != "tag" || "$tag_object_sha" != "$local_tag_object_sha" ]]; then
            echo "::error::GitHub tag ref is not the checked-out annotated tag object."
            exit 1
          fi

          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          if [[ "$(jq -r '.tag' <<<"$tag_json")" != "$RELEASE_TAG" \
            || "$(jq -r '.object.type' <<<"$tag_json")" != "commit" \
            || "$(jq -r '.object.sha' <<<"$tag_json")" != "$wallet_sha" ]]; then
            echo "::error::Annotated tag identity does not match $RELEASE_TAG at $wallet_sha."
            exit 1
          fi
          if [[ "$(jq -r '.verification.verified' <<<"$tag_json")" != "true" \
            || "$(jq -r '.verification.reason' <<<"$tag_json")" != "valid" ]]; then
            echo "::error::GitHub did not verify a valid cryptographic signature on $RELEASE_TAG."
            exit 1
          fi

          wallet_commit_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$wallet_sha")"
          if [[ "$(jq -r '.sha' <<<"$wallet_commit_json")" != "$wallet_sha" \
            || "$(jq -r '.commit.verification.verified' <<<"$wallet_commit_json")" != "true" \
            || "$(jq -r '.commit.verification.reason' <<<"$wallet_commit_json")" != "valid" ]]; then
            echo "::error::GitHub did not verify a valid cryptographic signature on wallet commit $wallet_sha."
            exit 1
          fi

          iroha_commit_json="$(gh api "repos/hyperledger-iroha/iroha/commits/$iroha_sha")"
          if [[ "$(jq -r '.sha' <<<"$iroha_commit_json")" != "$iroha_sha" \
            || "$(jq -r '.commit.verification.verified' <<<"$iroha_commit_json")" != "true" \
            || "$(jq -r '.commit.verification.reason' <<<"$iroha_commit_json")" != "valid" ]]; then
            echo "::error::GitHub did not verify a valid cryptographic signature on Iroha commit $iroha_sha."
            exit 1
          fi
          iroha_parent_json="$(gh api "repos/hyperledger-iroha/iroha/commits/$iroha_parent")"
          if [[ "$(jq -r '.sha' <<<"$iroha_parent_json")" != "$iroha_parent" \
            || "$(jq -r '.commit.verification.verified' <<<"$iroha_parent_json")" != "true" \
            || "$(jq -r '.commit.verification.reason' <<<"$iroha_parent_json")" != "valid" ]]; then
            echo "::error::GitHub did not verify a valid cryptographic signature on Iroha parent $iroha_parent."
            exit 1
          fi

          {
            echo "wallet_sha=$wallet_sha"
            echo "iroha_sha=$iroha_sha"
            echo "iroha_parent=$iroha_parent"
            echo "iroha_tree=$iroha_tree"
            echo "iroha_js_tree=$iroha_js_tree"
            echo "tag_object_sha=$tag_object_sha"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout wallet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: iroha-demo-javascript
          ref: ${{ env.APP_REF }}
          persist-credentials: false

      - name: Checkout Iroha SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperledger-iroha/iroha
          path: iroha
          ref: ${{ env.IROHA_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identities
        shell: bash
        run: |
          test "$(git -C iroha-demo-javascript rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C iroha rev-parse HEAD)" = "$IROHA_REF"
          test "$(git -C iroha rev-list --parents -n 1 HEAD)" = "$IROHA_REF $REVIEWED_IROHA_PARENT"
          test "$(git -C iroha rev-parse 'HEAD^{tree}')" = "$REVIEWED_IROHA_TREE"
          test "$(git -C iroha rev-parse HEAD:javascript/iroha_js)" = "$REVIEWED_IROHA_JS_TREE"
          test "$(git -C iroha rev-parse --is-shallow-repository)" = "false"
          test -z "$(git -C iroha replace -l)"
          test -z "$(git -C iroha submodule status --recursive)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iroha-demo-javascript/package-lock.json

      - name: Prepare authenticated Iroha release source
        env:
          IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64: ${{ secrets.IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64 }}
        run: >-
          node iroha-demo-javascript/scripts/prepare-iroha-release-source.mjs
          --iroha-root iroha

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Provision authenticated ignored Iroha Cargo lock
        shell: bash
        run: |
          test ! -e iroha/Cargo.lock
          cp iroha-demo-javascript/resources/release/iroha-v4-Cargo.lock iroha/Cargo.lock
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync } = require("node:fs");
          const path = "iroha/Cargo.lock";
          const stat = lstatSync(path);
          const bytes = readFileSync(path);
          const digest = createHash("sha256").update(bytes).digest("hex");
          if (!stat.isFile() || stat.isSymbolicLink()) throw new Error("Cargo.lock is not a regular file");
          if (bytes.length !== Number(process.env.REVIEWED_IROHA_CARGO_LOCK_SIZE)) throw new Error("Cargo.lock size mismatch");
          if (digest !== process.env.REVIEWED_IROHA_CARGO_LOCK_SHA256) throw new Error("Cargo.lock digest mismatch");
          NODE
          test "$(git -C iroha ls-files --others --ignored --exclude-standard)" = "Cargo.lock"
          test -z "$(git -C iroha status --porcelain=v1 --untracked-files=all)"

      - name: Build reviewed Iroha native binding
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/iroha-js-native-target
        run: >-
          node iroha-demo-javascript/scripts/build-iroha-native.mjs
          --sdk-root iroha/javascript/iroha_js

      - name: Verify reviewed native build closure
        shell: bash
        run: |
          expected_ignored=$'Cargo.lock\njavascript/iroha_js/native/iroha_js_host.checksums.json\njavascript/iroha_js/native/iroha_js_host.node'
          observed_ignored="$(git -C iroha ls-files --others --ignored --exclude-standard | LC_ALL=C sort)"
          test "$observed_ignored" = "$expected_ignored"
          test -z "$(git -C iroha status --porcelain=v1 --untracked-files=all)"
          node --input-type=module <<'NODE'
          import { lstatSync } from "node:fs";
          import {
            resolveNativeBuildRequirement,
            resolveNativeProvenanceRequirement,
          } from "./iroha-demo-javascript/scripts/postinstallNativeCheck.mjs";
          const sdkRoot = "iroha/javascript/iroha_js";
          for (const filename of ["iroha_js_host.node", "iroha_js_host.checksums.json"]) {
            const artifact = `${sdkRoot}/native/${filename}`;
            const stat = lstatSync(artifact);
            if (!stat.isFile() || stat.isSymbolicLink()) {
              throw new Error(`${artifact} must be a regular build artifact`);
            }
          }
          const requirement = resolveNativeBuildRequirement(
            sdkRoot,
            undefined,
            undefined,
            resolveNativeProvenanceRequirement(process.env),
          );
          if (requirement.shouldBuild) {
            throw new Error(`reviewed native build failed verification: ${requirement.reason}`);
          }
          NODE

      - name: Install exact reviewed release dependencies
        working-directory: iroha-demo-javascript
        run: npm run install:release

      - name: Verify exact reviewed release dependency selection
        working-directory: iroha-demo-javascript
        run: npm run verify:iroha-sdk

      - name: Verify
        working-directory: iroha-demo-javascript
        run: npm run verify

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout wallet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: iroha-demo-javascript
          ref: ${{ env.APP_REF }}
          persist-credentials: false

      - name: Checkout Iroha SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperledger-iroha/iroha
          path: iroha
          ref: ${{ env.IROHA_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identities
        shell: bash
        run: |
          test "$(git -C iroha-demo-javascript rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C iroha rev-parse HEAD)" = "$IROHA_REF"
          test "$(git -C iroha rev-list --parents -n 1 HEAD)" = "$IROHA_REF $REVIEWED_IROHA_PARENT"
          test "$(git -C iroha rev-parse 'HEAD^{tree}')" = "$REVIEWED_IROHA_TREE"
          test "$(git -C iroha rev-parse HEAD:javascript/iroha_js)" = "$REVIEWED_IROHA_JS_TREE"
          test "$(git -C iroha rev-parse --is-shallow-repository)" = "false"
          test -z "$(git -C iroha replace -l)"
          test -z "$(git -C iroha submodule status --recursive)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iroha-demo-javascript/package-lock.json

      - name: Prepare authenticated Iroha release source
        env:
          IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64: ${{ secrets.IROHA_RELEASE_SIGNER_PUBLIC_KEY_BASE64 }}
        run: >-
          node iroha-demo-javascript/scripts/prepare-iroha-release-source.mjs
          --iroha-root iroha

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Pin macOS native deployment target
        if: matrix.platform == 'mac'
        shell: bash
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"

      - name: Provision authenticated ignored Iroha Cargo lock
        shell: bash
        run: |
          test ! -e iroha/Cargo.lock
          cp iroha-demo-javascript/resources/release/iroha-v4-Cargo.lock iroha/Cargo.lock
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync } = require("node:fs");
          const path = "iroha/Cargo.lock";
          const stat = lstatSync(path);
          const bytes = readFileSync(path);
          const digest = createHash("sha256").update(bytes).digest("hex");
          if (!stat.isFile() || stat.isSymbolicLink()) throw new Error("Cargo.lock is not a regular file");
          if (bytes.length !== Number(process.env.REVIEWED_IROHA_CARGO_LOCK_SIZE)) throw new Error("Cargo.lock size mismatch");
          if (digest !== process.env.REVIEWED_IROHA_CARGO_LOCK_SHA256) throw new Error("Cargo.lock digest mismatch");
          NODE
          test "$(git -C iroha ls-files --others --ignored --exclude-standard)" = "Cargo.lock"
          test -z "$(git -C iroha status --porcelain=v1 --untracked-files=all)"

      - name: Build reviewed Iroha native binding
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/iroha-js-native-target
        run: >-
          node iroha-demo-javascript/scripts/build-iroha-native.mjs
          --sdk-root iroha/javascript/iroha_js

      - name: Verify reviewed native build closure
        shell: bash
        run: |
          expected_ignored=$'Cargo.lock\njavascript/iroha_js/native/iroha_js_host.checksums.json\njavascript/iroha_js/native/iroha_js_host.node'
          observed_ignored="$(git -C iroha ls-files --others --ignored --exclude-standard | LC_ALL=C sort)"
          test "$observed_ignored" = "$expected_ignored"
          test -z "$(git -C iroha status --porcelain=v1 --untracked-files=all)"
          node --input-type=module <<'NODE'
          import { lstatSync } from "node:fs";
          import {
            resolveNativeBuildRequirement,
            resolveNativeProvenanceRequirement,
          } from "./iroha-demo-javascript/scripts/postinstallNativeCheck.mjs";
          const sdkRoot = "iroha/javascript/iroha_js";
          for (const filename of ["iroha_js_host.node", "iroha_js_host.checksums.json"]) {
            const artifact = `${sdkRoot}/native/${filename}`;
            const stat = lstatSync(artifact);
            if (!stat.isFile() || stat.isSymbolicLink()) {
              throw new Error(`${artifact} must be a regular build artifact`);
            }
          }
          const requirement = resolveNativeBuildRequirement(
            sdkRoot,
            undefined,
            undefined,
            resolveNativeProvenanceRequirement(process.env),
          );
          if (requirement.shouldBuild) {
            throw new Error(`reviewed native build failed verification: ${requirement.reason}`);
          }
          NODE

      - name: Test native secure private-file boundary
        working-directory: iroha
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/iroha-js-native-target
        run: cargo test -p iroha_js_host secure_private --locked

      - name: Install macOS packaging tools
        if: matrix.platform == 'mac'
        run: brew install xcodegen

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools rpm

      - name: Require production platform signing
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" && "$HAS_MAC_SIGNING" != "true" ]]; then
            echo "::error::Every release requires complete macOS Developer ID signing and notarization credentials."
            exit 1
          fi
          if [[ "${{ matrix.platform }}" == "win" && "$HAS_WIN_SIGNING" != "true" ]]; then
            echo "::error::Every release requires complete Windows Authenticode signing credentials."
            exit 1
          fi

      - name: Prepare Windows signing certificate
        if: matrix.platform == 'win' && env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          if (Test-Path -LiteralPath $certPath) {
            throw "Refusing to overwrite an existing release certificate file."
          }
          try {
            $certBytes = [Convert]::FromBase64String($env:WIN_CSC_LINK_SECRET)
          } catch {
            throw "WIN_CSC_LINK is not canonical base64 certificate data."
          }
          if ([Convert]::ToBase64String($certBytes) -cne $env:WIN_CSC_LINK_SECRET) {
            throw "WIN_CSC_LINK must use canonical unwrapped base64 encoding."
          }
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificates = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          $certificates.Import($certBytes, $env:WIN_CSC_KEY_PASSWORD_SECRET, $flags)
          $privateCertificates = @($certificates | Where-Object HasPrivateKey)
          if ($privateCertificates.Count -cne 1) {
            throw "The Windows release PFX must contain exactly one certificate with a private key."
          }
          $certificate = $privateCertificates[0]
          $now = [DateTime]::UtcNow
          if ($now -lt $certificate.NotBefore.ToUniversalTime() -or $now -gt $certificate.NotAfter.ToUniversalTime()) {
            throw "The Windows release certificate is not currently valid."
          }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $hasCodeSigningEku = $false
          foreach ($extension in $certificate.Extensions) {
            if ($extension -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($usage in $extension.EnhancedKeyUsages) {
                if ($usage.Value -ceq $codeSigningOid) {
                  $hasCodeSigningEku = $true
                }
              }
            }
          }
          if (-not $hasCodeSigningEku) {
            throw "The Windows release certificate is not authorized for code signing."
          }
          $thumbprint = $certificate.Thumbprint.ToUpperInvariant()
          if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') {
            throw "The Windows release certificate has an invalid SHA-1 thumbprint."
          }
          "WIN_CSC_LINK=$certPath" >> $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$env:WIN_CSC_KEY_PASSWORD_SECRET" >> $env:GITHUB_ENV
          "WIN_EXPECTED_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Prepare macOS signing and notarization
        if: matrix.platform == 'mac' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ ! "$APPLE_DEVELOPMENT_TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_DEVELOPMENT_TEAM must be an exact ten-character team ID."
            exit 1
          fi
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_API_KEY_ID must be an exact ten-character key ID."
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::APPLE_API_ISSUER must be an exact UUID."
            exit 1
          fi
          cert_path="$RUNNER_TEMP/mac-codesign.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(uuidgen)"

          test ! -e "$cert_path"
          test ! -e "$api_key_path"
          test ! -e "$keychain_path"
          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 -D > "$cert_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$cert_path" "$api_key_path"
          test -s "$cert_path"
          test "$(base64 < "$cert_path" | tr -d '\r\n')" = "$MAC_CERTIFICATE_P12_BASE64"
          test "$(base64 < "$api_key_path" | tr -d '\r\n')" = "$APPLE_API_KEY_P8_BASE64"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"
          grep -q '^-----END PRIVATE KEY-----$' "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          matching_identities="$(
            security find-identity -v -p codesigning "$keychain_path" |
              grep -E '"Developer ID Application: .+ \('"$APPLE_DEVELOPMENT_TEAM"'\)"' || true
          )"
          if [[ "$(printf '%s\n' "$matching_identities" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]]; then
            echo "::error::The release P12 must contain exactly one Developer ID Application identity for team $APPLE_DEVELOPMENT_TEAM."
            exit 1
          fi
          identity_hash="$(printf '%s\n' "$matching_identities" | awk '{print $2}')"
          if [[ ! "$identity_hash" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::Unable to resolve the exact Developer ID Application identity."
            exit 1
          fi

          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"
            echo "CSC_NAME=$identity_hash"
            echo "APPLE_DEVELOPMENT_TEAM=$APPLE_DEVELOPMENT_TEAM"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_SIGN_IDENTITY=$identity_hash"
            echo "APPLE_XCODE_SIGN_IDENTITY=$identity_hash"
            echo "APPLE_CODESIGN_TIMESTAMP=true"
          } >> "$GITHUB_ENV"

      - name: Install exact reviewed release dependencies
        working-directory: iroha-demo-javascript
        run: npm run install:release

      - name: Verify exact reviewed release dependency selection
        working-directory: iroha-demo-javascript
        run: npm run verify:iroha-sdk

      - name: Verify Windows governance-integrity storage
        if: matrix.platform == 'win'
        working-directory: iroha-demo-javascript
        run: >-
          npx vitest run
          tests/secureBoundedJson.spec.ts
          tests/governanceValidationFee.spec.ts
          tests/governanceValidationFeeFinality.spec.ts

      - name: Build macOS artifacts
        if: matrix.platform == 'mac'
        working-directory: iroha-demo-javascript
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never

      - name: Build Windows artifacts
        if: matrix.platform == 'win'
        working-directory: iroha-demo-javascript
        run: npm run dist:win -- --${{ matrix.arch }} --publish never

      - name: Build Linux artifacts
        if: matrix.platform == 'linux'
        working-directory: iroha-demo-javascript
        run: npm run dist:linux -- --${{ matrix.arch }} --publish never

      - name: Verify notarized macOS application
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: iroha-demo-javascript
        run: |
          app_count="$(find release -mindepth 2 -maxdepth 2 -type d -name 'SORA Wallet.app' | wc -l | tr -d ' ')"
          if [[ "$app_count" != "1" ]]; then
            echo "::error::Expected one packaged SORA Wallet.app; found $app_count."
            exit 1
          fi
          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'SORA Wallet.app' -print -quit)"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Verify signed Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: iroha-demo-javascript
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = Join-Path "release" "SORA-Wallet-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "The exact Windows installer is missing: $installer"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status.ToString() -cne "Valid") {
            throw "The Windows installer does not have a valid Authenticode signature."
          }
          if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -cne $env:WIN_EXPECTED_CERT_THUMBPRINT) {
            throw "The Windows installer was not signed by the exact release certificate."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "The Windows installer signature does not have a trusted timestamp."
          }

      - name: Collect release artifacts
        shell: bash
        working-directory: iroha-demo-javascript
        run: >-
          node scripts/collect-release-artifacts.mjs
          --input release
          --output artifact-output
          --version "${RELEASE_TAG#v}"
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: iroha-demo-javascript/artifact-output/*
          if-no-files-found: error

  publish:
    name: Prepare keyless-signed draft GitHub release
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IROHA_COMMIT_SHA: ${{ needs.preflight.outputs.iroha_sha }}
      RELEASE_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
      SIGSTORE_CERTIFICATE_IDENTITY: "https://github.com/${{ github.workflow_ref }}"
      SIGSTORE_CERTIFICATE_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
      WALLET_COMMIT_SHA: ${{ needs.preflight.outputs.wallet_sha }}
    steps:
      - name: Checkout immutable release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: iroha-demo-javascript
          ref: ${{ env.APP_REF }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Validate immutable release ref and artifact inventory
        shell: bash
        run: |
          expected_ref="refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Keyless release signing requires the workflow itself to run from $expected_ref; got $GITHUB_REF."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag is not a supported version tag: $RELEASE_TAG"
            exit 1
          fi
          test "$(git -C iroha-demo-javascript rev-parse HEAD)" = "$GITHUB_SHA"
          node iroha-demo-javascript/scripts/collect-release-artifacts.mjs \
            --input artifacts \
            --version "${RELEASE_TAG#v}" \
            --platform all \
            --validate-only

      - name: Write immutable source identity
        shell: bash
        run: |
          test "$WALLET_COMMIT_SHA" = "$GITHUB_SHA"
          test "$IROHA_COMMIT_SHA" = "$IROHA_REF"
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg tag_object_sha "$RELEASE_TAG_OBJECT_SHA" \
            --arg node_version "$NODE_VERSION" \
            --arg rust_toolchain "$RUST_TOOLCHAIN" \
            --arg native_build_profile "$IROHA_JS_NATIVE_BUILD_PROFILE" \
            --arg wallet_repository "$GITHUB_REPOSITORY" \
            --arg wallet_commit_sha "$WALLET_COMMIT_SHA" \
            --arg iroha_repository "hyperledger-iroha/iroha" \
            --arg iroha_commit_sha "$IROHA_COMMIT_SHA" \
            --arg iroha_parent_commit "$REVIEWED_IROHA_PARENT" \
            --arg iroha_tree "$REVIEWED_IROHA_TREE" \
            --arg iroha_js_tree "$REVIEWED_IROHA_JS_TREE" \
            --arg iroha_cargo_lock_sha256 "$REVIEWED_IROHA_CARGO_LOCK_SHA256" \
            --argjson iroha_cargo_lock_size "$REVIEWED_IROHA_CARGO_LOCK_SIZE" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '{
              schema: "sora.wallet.release-source.v3",
              release_tag: $release_tag,
              tag_object_sha: $tag_object_sha,
              build: {
                node_version: $node_version,
                rust_toolchain: $rust_toolchain,
                native_build_profile: $native_build_profile,
                exact_artifact_count: 9,
                platform_signing: {
                  macos_developer_id_notarization: "required-and-verified",
                  windows_authenticode: "required-and-verified"
                }
              },
              wallet: {
                repository: $wallet_repository,
                commit_sha: $wallet_commit_sha
              },
              iroha: {
                repository: $iroha_repository,
                commit_sha: $iroha_commit_sha,
                parent_commit: $iroha_parent_commit,
                tree: $iroha_tree,
                javascript_tree: $iroha_js_tree,
                cargo_lock: {
                  sha256: $iroha_cargo_lock_sha256,
                  size_bytes: $iroha_cargo_lock_size
                },
                native_contract: {
                  source_git_revision: $iroha_commit_sha,
                  source_tree_clean: true,
                  build_provenance_version: 3,
                  build_execution_policy: "trusted-local-cargo-v1",
                  connect_norito_bridge_abi_version: 23,
                  secure_private_file_abi_version: 1,
                  validation_fee_policy_fingerprint_vector: "4742b1f274928767564c6effa414e640e6f635874d74684b06b95414c5afa16e",
                  validation_fee_payout_lifecycle_fingerprint_vector: "8fd84f6599e22db4da15f7152a914dc0091dd73a7906d5981cce37d485191c25",
                  required_exports: [
                    "accountAddressParseEncoded",
                    "accountAddressRender",
                    "deriveConfidentialReceiveAddressV2",
                    "buildIvmProvedTransactionPayload",
                    "signQuotedIvmProvedTransactionPayload",
                    "buildTransactionPayload",
                    "signQuotedTransactionPayload",
                    "encodeSignedTransactionVersioned",
                    "hashSignedTransaction",
                    "decodeTransactionReceiptJson",
                    "noritoDecodeInstruction",
                    "noritoEncodeInstruction",
                    "inspectSubscriptionTriggerAction",
                    "validationFeeHijiriQuoteRequestV1",
                    "validationFeeVerifyHijiriQuoteResponseV1",
                    "validationFeePolicyProposalFingerprintV1",
                    "validationFeePayoutLifecycleProposalFingerprintV1",
                    "connectNoritoBridgeAbiVersion",
                    "securePrivateFileAbiVersion",
                    "securePrivateDirectoryEnsure",
                    "securePrivateFileRead",
                    "securePrivateFileWriteAtomic"
                  ]
                }
              },
              workflow_ref: $workflow_ref
            }' > artifacts/SOURCE-IDENTITY.json
          test -s artifacts/SOURCE-IDENTITY.json

      - name: Create checksum manifest
        shell: bash
        run: |
          find artifacts -maxdepth 1 -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.rpm' -o \
            -name '*.zip' -o \
            -name 'SOURCE-IDENTITY.json' \
          \) -print0 | sort -z | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && shasum -a 256 "$(basename "$file")")
          done > artifacts/SHA256SUMS.txt
          test -s artifacts/SHA256SUMS.txt
          test "$(wc -l < artifacts/SHA256SUMS.txt | tr -d ' ')" = "10"
          (cd artifacts && shasum -a 256 -c SHA256SUMS.txt)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with GitHub OIDC
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            cosign sign-blob "$file" \
              --bundle "$file.sigstore.json" \
              --yes
          done < <(
            find artifacts -maxdepth 1 -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.rpm' -o \
              -name '*.zip' \
              -o -name 'SHA256SUMS.txt' \
              -o -name 'SOURCE-IDENTITY.json' \
            \) -print0 | sort -z
          )

      - name: Verify every Sigstore bundle
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bundle="$file.sigstore.json"
            test -s "$bundle"
            cosign verify-blob "$file" \
              --bundle "$bundle" \
              --certificate-identity "$SIGSTORE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_CERTIFICATE_OIDC_ISSUER" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA"
          done < <(
            find artifacts -maxdepth 1 -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.rpm' -o \
              -name '*.zip' \
              -o -name 'SHA256SUMS.txt' \
              -o -name 'SOURCE-IDENTITY.json' \
            \) -print0 | sort -z
          )

      - name: Write Sigstore verification instructions
        shell: bash
        run: |
          {
            cat <<'EOF'
          # Verify SORA Wallet release artifacts

          These bundles provide Sigstore keyless provenance from the tagged
          GitHub Actions release workflow. Sigstore does not itself provide
          platform signing; this release workflow separately requires and
          verifies macOS Developer ID notarization and Windows Authenticode.

          `SOURCE-IDENTITY.json` records the verified signed tag object, wallet
          commit, and exact Iroha commit used for the build.

          Install Cosign, download an artifact and its adjacent
          `.sigstore.json` bundle, then run:

          ```bash
          EOF
            printf "certificate_identity='%s'\n" "$SIGSTORE_CERTIFICATE_IDENTITY"
            printf "certificate_oidc_issuer='%s'\n" "$SIGSTORE_CERTIFICATE_OIDC_ISSUER"
            printf "certificate_github_workflow_ref='%s'\n" "$GITHUB_REF"
            printf "certificate_github_workflow_repository='%s'\n" "$GITHUB_REPOSITORY"
            printf "certificate_github_workflow_sha='%s'\n" "$GITHUB_SHA"
            printf "artifact='SORA-Wallet-%s-<os>-<arch>.<ext>'\n" "${RELEASE_TAG#v}"
            cat <<'EOF'

          cosign verify-blob "$artifact" \
            --bundle "$artifact.sigstore.json" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "$certificate_oidc_issuer" \
            --certificate-github-workflow-ref "$certificate_github_workflow_ref" \
            --certificate-github-workflow-repository "$certificate_github_workflow_repository" \
            --certificate-github-workflow-sha "$certificate_github_workflow_sha"

          cosign verify-blob SOURCE-IDENTITY.json \
            --bundle SOURCE-IDENTITY.json.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "$certificate_oidc_issuer" \
            --certificate-github-workflow-ref "$certificate_github_workflow_ref" \
            --certificate-github-workflow-repository "$certificate_github_workflow_repository" \
            --certificate-github-workflow-sha "$certificate_github_workflow_sha"

          cosign verify-blob SHA256SUMS.txt \
            --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "$certificate_oidc_issuer" \
            --certificate-github-workflow-ref "$certificate_github_workflow_ref" \
            --certificate-github-workflow-repository "$certificate_github_workflow_repository" \
            --certificate-github-workflow-sha "$certificate_github_workflow_sha"

          shasum -a 256 -c SHA256SUMS.txt
          ```
          EOF
          } > artifacts/SIGSTORE-VERIFY.md

      - name: Replace draft release with the verified local inventory
        shell: bash
        run: |
          upload_with_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$file"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep "$((attempt * 2))"
              fi
            done
            echo "::error::Failed to upload $file after 3 attempts."
            return 1
          }

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          elif [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::Refusing to replace assets on an already-published release."
            exit 1
          fi

          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          while IFS= read -r -d '' file; do
            upload_with_retry "$file"
          done < <(
            find artifacts -maxdepth 1 -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.rpm' -o \
              -name '*.zip' -o \
              -name '*.sigstore.json' -o \
              -name 'SOURCE-IDENTITY.json' -o \
              -name 'SHA256SUMS.txt' -o \
              -name 'SIGSTORE-VERIFY.md' \
            \) -print0 | sort -z
          )

      - name: Verify draft release asset inventory
        shell: bash
        run: |
          expected_assets="$(mktemp)"
          remote_assets="$(mktemp)"

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            printf '%s\n' "$name" "$name.sigstore.json"
          done < <(
            find artifacts -maxdepth 1 -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.rpm' -o \
              -name '*.zip' \
            \) -print0 | sort -z
          ) > "$expected_assets"
          printf '%s\n' \
            'SOURCE-IDENTITY.json' \
            'SOURCE-IDENTITY.json.sigstore.json' \
            'SHA256SUMS.txt' \
            'SHA256SUMS.txt.sigstore.json' \
            'SIGSTORE-VERIFY.md' >> "$expected_assets"
          sort -u -o "$expected_assets" "$expected_assets"

          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | sort -u > "$remote_assets"
          if ! diff -u "$expected_assets" "$remote_assets"; then
            echo "::error::Draft release assets do not exactly match the verified local inventory."
            exit 1
          fi

          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::Release must remain a draft after signing and verification."
            exit 1
          fi
